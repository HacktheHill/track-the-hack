name: Track the Hack CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: track-the-hack-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            SKIP_ENV_VALIDATION: "1"
            DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
            NODE_ENV: production
            NEXTAUTH_SECRET: build-only-secret
            NEXTAUTH_URL: https://build.invalid
            GOOGLE_CLIENT_ID: build
            GOOGLE_CLIENT_SECRET: build
            SHEETS_INTEGRATION_API_KEY: build-only-sheets-key-with-at-least-32-characters
            CANCELLATION_TOKEN_SECRET: build-only-cancellation-secret-at-least-32-characters
            SPONSORSHIP_GOOGLE_CLIENT_ID: build
            SPONSORSHIP_GOOGLE_CLIENT_SECRET: build
            SPONSORSHIP_GOOGLE_REFRESH_TOKEN: build
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci --include=dev
            - run: npm test
            - run: npx tsc --noEmit
            - run: npm run build
