<!DOCTYPE html>
<html>
	<head>
		<base target="_top">
		<style>
			body { font: 14px Arial, sans-serif; margin: 18px; color: #202124; }
			button { background: #1a73e8; border: 0; border-radius: 4px; color: white; cursor: pointer; padding: 11px 16px; }
			button:disabled { cursor: wait; opacity: .6; }
			#status { line-height: 1.5; margin-top: 16px; }
			#error { color: #b3261e; }
		</style>
	</head>
	<body>
		<button id="issue" type="button">Show pass activation QR</button>
		<p id="status" role="status"></p>
		<p id="error" role="alert"></p>
		<script>
			const button = document.getElementById("issue");
			const status = document.getElementById("status");
			const error = document.getElementById("error");
			button.addEventListener("click", () => {
				// Open synchronously from the click so the browser can reuse one named window.
				// The organiser may move and maximise it on a second display.
				// An empty URL inherits the sandboxed Apps Script document URL and can
				// open the Apps Script project list instead of the reusable QR window.
				const display = window.open("about:blank", "trackTheHackPass", "popup=yes,width=900,height=900");
				if (display) {
					try { display.document.body.textContent = "Preparing pass…"; } catch (_) { /* Existing Tracker window is cross-origin. */ }
					display.focus();
				}
				button.disabled = true;
				status.textContent = "Preparing pass…";
				error.textContent = "";
				google.script.run
					.withSuccessHandler(result => {
						button.disabled = false;
						status.textContent = "QR ready for five minutes.";
						if (display && !display.closed) display.location.replace(result.displayUrl);
						else {
							const link = document.createElement("a");
							link.href = result.displayUrl;
							link.target = "trackTheHackPass";
							link.rel = "noopener";
							link.textContent = "Open QR";
							status.append(document.createElement("br"), link);
						}
					})
					.withFailureHandler(failure => {
						button.disabled = false;
						status.textContent = "";
						error.textContent = failure.message || "Could not show the QR.";
						if (display && !display.closed) display.close();
					})
					.issuePassForSelectedRow();
			});
		</script>
	</body>
</html>
