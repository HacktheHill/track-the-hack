<!doctype html>
<html>
	<head>
		<base target="_blank" />
		<meta charset="utf-8" />
		<style>
			body {
				box-sizing: border-box;
				font:
					14px/1.45 Arial,
					sans-serif;
				margin: 0;
				padding: 18px;
				color: #202124;
			}
			h1 {
				font-size: 18px;
				margin: 0 0 10px;
			}
			p {
				margin: 0 0 14px;
			}
			button {
				width: 100%;
				border: 0;
				border-radius: 4px;
				background: #1967d2;
				color: white;
				cursor: pointer;
				font-weight: 600;
				padding: 11px 14px;
			}
			button:disabled {
				cursor: wait;
				opacity: 0.65;
			}
			.note {
				color: #5f6368;
				font-size: 12px;
			}
			#status {
				border-radius: 4px;
				margin-top: 14px;
				padding: 10px;
			}
			#status:empty {
				display: none;
			}
			.info {
				background: #e8f0fe;
				color: #174ea6;
			}
			.success {
				background: #e6f4ea;
				color: #137333;
			}
			.error {
				background: #fce8e6;
				color: #a50e0e;
			}
			a {
				color: inherit;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<h1>Participant access</h1>
		<p>Select any cell in one accepted applicant's row, then use the button below.</p>
		<button id="issue" type="button">Provision &amp; show QR</button>
		<div id="status" role="status" aria-live="polite"></div>
		<p class="note">
			A QR expires after five minutes. Issuing another QR signs this participant out of any device currently using
			their pass.
		</p>

		<script>
			const displayWindowName = "trackTheHackClaimQrDisplay";
			let displayWindow = null;

			function setStatus(message, kind) {
				const status = document.getElementById("status");
				status.className = kind;
				status.textContent = message;
			}

			function prepareDisplayWindow() {
				// Clear the previous participant's QR while a new one is issued.
				// Keeping the live handle avoids refocusing a second screen.
				try {
					if (displayWindow && !displayWindow.closed) {
						displayWindow.location.replace("about:blank");
						return;
					}
				} catch (_error) {
					// Reacquire the named window after browser isolation or a sidebar reload.
				}
				// Opening in the click handler avoids popup blocking after the
				// asynchronous Apps Script call returns.
				try {
					displayWindow = window.open("about:blank", displayWindowName);
				} catch (_error) {
					displayWindow = null;
				}
				if (displayWindow) {
					try {
						displayWindow.document.title = "Track the Hack QR";
						displayWindow.document.body.textContent = "Preparing participant QR…";
					} catch (_error) {
						// A previously opened Track page may still be navigating to blank.
					}
				}
			}

			function finish(result) {
				const button = document.getElementById("issue");
				button.disabled = false;
				try {
					if (displayWindow && !displayWindow.closed) {
						displayWindow.location.replace(result.displayUrl);
						const suffix = result.warning ? ` ${result.warning}` : "";
						setStatus(
							`Row ${result.rowNumber}: QR ready. RSVP ${result.rsvpStatus || "status unavailable"}.${suffix}`,
							"success",
						);
						return;
					}
				} catch (_error) {
					// Browser isolation may sever the popup handle after navigation.
				}

				const status = document.getElementById("status");
				status.className = "error";
				status.textContent = "The browser blocked the QR window. ";
				const link = document.createElement("a");
				link.href = result.displayUrl;
				link.target = "_blank";
				link.rel = "noopener noreferrer";
				link.textContent = "Open the QR display";
				status.appendChild(link);
			}

			function fail(error) {
				document.getElementById("issue").disabled = false;
				setStatus(error && error.message ? error.message : "Unable to issue participant access.", "error");
			}

			document.getElementById("issue").addEventListener("click", () => {
				const button = document.getElementById("issue");
				button.disabled = true;
				setStatus("Provisioning the selected participant…", "info");
				prepareDisplayWindow();
				google.script.run
					.withSuccessHandler(finish)
					.withFailureHandler(fail)
					.provisionSelectedParticipantAndIssueAccess();
			});
		</script>
	</body>
</html>
