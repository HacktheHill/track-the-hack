    <text x="194" y="500">C409</text>
    <text x="371" y="535" font-size="10">C402A</text>
    <text x="371" y="473" font-size="11">C402</text>
    <text x="475" y="525">C420</text>
    <text x="541" y="525">C421</text>
    <text x="610" y="525">C422</text>
