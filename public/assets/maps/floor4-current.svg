    <text x="747" y="525">C424</text>
    <text x="815" y="525">C425</text>
    <text x="884" y="525">C426</text>
    <text x="951" y="525">C427</text>
    <text x="1052" y="534" font-size="9">C431A</text>
    <text x="1054" y="477" font-size="9">C431</text>
    <text x="1153" y="413" font-size="8">C441</text>
    <text x="1335" y="265">C445</text>
    <text x="1335" y="224">C446</text>
  </g>
  <g fill="#000" stroke="#fff" stroke-width="1.2">
    <rect x="82" y="301" width="54" height="42"/>
    <rect x="82" y="466" width="54" height="42"/>
    <rect x="257" y="480" width="54" height="42"/>
    <rect x="1093" y="475" width="54" height="42"/>
    <rect x="1235" y="415" width="60" height="46"/>
  </g>
  <g fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="109" y="323">C407</text>
    <text x="109" y="488">C408</text>
    <text x="284" y="502">C410</text>
    <text x="1120" y="497">C440</text>
    <text x="1265" y="439">C442</text>
  </g>
  <!-- Each accessible washroom badge sits inside its source-plan enclosure. -->
  <g fill="#000" stroke="white" stroke-width="0.8">
    <rect x="192" y="161" width="30" height="29" rx="1"/>
    <rect x="241" y="214" width="30" height="29" rx="1"/>
    <rect x="1320" y="79" width="30" height="28" rx="1"/>
    <rect x="1201" y="76" width="30" height="26" rx="1"/>
