<svg xmlns="http://www.w3.org/2000/svg" width="3460" height="1538" viewBox="0 0 1440 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CRX floor 4 — rooms, washrooms and central circulation</title>
  <desc id="desc">Simplified Learning Crossroads fourth floor, traced from the University of Ottawa plan dated 17 May 2026. Rotated 180 degrees to match the existing Track the Hack maps. Includes CRX rooms, the two central atrium openings, columns, the central staircase and elevators 1, 2 and 3. C404 and C448 are men's accessible washrooms, C405 and C449 are women's accessible washrooms, and C447 is a single-stall accessible washroom. Adjoining buildings, furniture and emergency equipment are omitted.</desc>
  <metadata>Source: https://www.uottawa.ca/about-us/sites/g/files/bhrskd336/files/2026-07/CRX%20-%20Niveau_level%204.pdf</metadata>
  <defs>
    <g id="accessible" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="4" cy="3" r="2" fill="white" stroke="none"/>
      <path d="M4 7v9h10l4 8h4M5 10h8M3 13a8 8 0 1 0 9 12"/>
    </g>
    <g id="man" fill="white">
      <circle cx="7" cy="4" r="3"/>
      <path d="M3 9h8l2 13h-3v13H7V23H6v12H3V22H1Z"/>
    </g>
    <g id="woman" fill="white">
      <circle cx="7" cy="4" r="3"/>
      <path d="M4 9h6l6 17h-5v9H8v-9H6v9H3v-9H-2Z"/>
    </g>
    <g id="toilet" fill="white">
      <rect x="0" y="2" width="13" height="12" rx="1"/>
      <path d="M0 17h20c0 7-5 11-10 11l2 6H3l3-7c-4-2-6-5-6-10Z"/>
    </g>
    <pattern id="stair-treads" width="4" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 0V28" stroke="#000" stroke-width=".7"/>
    </pattern>
    <g id="elevator-badge" fill="none" stroke="white" stroke-width=".9" stroke-linecap="square">
      <rect width="23" height="29" fill="black"/>
      <rect x="5" y="7" width="13" height="15"/>
      <path d="M11.5 1v4M9 3.5l2.5-2.5L14 3.5M11.5 24v4M9 25.5l2.5 2.5 2.5-2.5"/>
    </g>
  </defs>
  <!-- The middle of CRX: atria and circulation core, in source-plan coordinates. -->
  <g id="central-circulation" transform="matrix(-1 0 0 -1 1440 650)" stroke="#000" fill="none">
    <g stroke-width="3.2" stroke-linejoin="miter">
      <path id="atrium-west" d="M437 255H670V317H437Z"/>
      <path id="atrium-east" d="M697 222H950L1042 317H697Z"/>
      <path id="central-staircase" d="M468 224H557V255H468Z" fill="url(#stair-treads)"/>
      <path id="central-elevators" d="M697 222H824V256H697ZM739 222V256M782 222V256"/>
      <path d="M670 317V337M697 317V337"/>
    </g>
    <g stroke-width=".9">
      <path d="M437 255L670 317M437 317L670 255"/>
      <path d="M697 222L1042 317M697 317L950 222"/>
    </g>
    <g id="central-columns" stroke-width="2.5">
      <circle cx="363" cy="298" r="4.5"/>
      <circle cx="431" cy="298" r="4.5"/>
      <circle cx="510" cy="297" r="5"/>
      <circle cx="588" cy="297" r="5"/>
      <circle cx="664" cy="297" r="5"/>
      <circle cx="702" cy="297" r="5"/>
      <circle cx="783" cy="300" r="5"/>
      <circle cx="862" cy="300" r="5"/>
      <circle cx="940" cy="300" r="5"/>
      <circle cx="1024" cy="277" r="4.5"/>
      <circle cx="510" cy="215" r="3.5"/>
      <circle cx="588" cy="215" r="3.5"/>
      <circle cx="665" cy="215" r="3.5"/>
      <circle cx="866" cy="215" r="3.5"/>
      <circle cx="946" cy="215" r="3.5"/>
      <circle cx="1025" cy="215" r="3.5"/>
    </g>
  </g>
  <!-- Core symbols remain upright after the map's 180-degree rotation. -->
  <g id="central-core-symbols">
    <use href="#elevator-badge" x="624" y="397"/>
    <use href="#elevator-badge" x="667" y="397"/>
    <use href="#elevator-badge" x="709" y="397"/>
    <rect x="915" y="397" width="27" height="28" fill="#000"/>
